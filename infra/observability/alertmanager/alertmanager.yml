global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: critical

receivers:
  - name: default
    # Wire to Slack/PagerDuty in production — see infra/README.md
    webhook_configs:
      - url: 'http://127.0.0.1:65535/alert'
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: 'http://127.0.0.1:65535/alert'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']
