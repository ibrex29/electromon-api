# Staging — API stack (web deployed separately)

services:
  postgres:
    container_name: electromon-staging-postgres
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    container_name: electromon-staging-redis

  rabbitmq:
    container_name: electromon-staging-rabbitmq

  minio:
    container_name: electromon-staging-minio

  minio-init:
    container_name: electromon-staging-minio-init

  migrate:
    container_name: electromon-staging-migrate
    environment:
      RUN_SEED: ${RUN_SEED:-true}

  api:
    container_name: electromon-staging-api
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
    deploy:
      resources:
        limits:
          memory: 512M
